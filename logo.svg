<svg xmlns-"http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" full= "none">
<defs>
 <!--clip path to keep the yellowstripes inside the clappperboard-->
 <clipPath id="clapperClip">
   <rect x="0" y="0" width="320" height="55" rx="12" />
<clipParth>
<defs>
  <!-- Clapperboard Top -->
  <g transform="translate(90, 120) rotate(-10)">
    <!-- Base dark bar -->
    <rect x="0" y="0" width="320" height="55" rx="12" fill="#2C2F33" />
    
    <!-- Yellow stripes clipped to the base -->
    <g clip-path="url(#clapperClip)">
      <polygon points="30,-10 70,-10 30,65 -10,65" fill="#F5C518" />
      <polygon points="100,-10 140,-10 100,65 60,65" fill="#F5C518" />
      <polygon points="170,-10 210,-10 170,65 130,65" fill="#F5C518" />
      <polygon points="240,-10 280,-10 240,65 200,65" fill="#F5C518" />
    </g>
  </g>

  <!-- Screen Body (Dark Gray) -->
  <rect x="120" y="200" width="260" height="170" rx="30" fill="#2C2F33" />
  
  <!-- Inner White Screen -->
  <rect x="140" y="220" width="220" height="130" rx="15" fill="#FFFFFF" />

  <!-- Play Button (Yellow) -->
  <polygon points="235,255 235,315 280,285" fill="#F5C518" />

  <!-- Text "CLIPSTREAM" -->
  <text x="250" y="460" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="52" text-anchor="middle" letter-spacing="1">
    <!-- "CLIP" in dark gray -->
    <tspan fill="#2C2F33">CLIP</tspan>
    <!-- "STREAM" in yellow -->
    <tspan fill="#F5C518">STREAM</tspan>
  </text>
</svg>
